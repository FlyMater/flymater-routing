name: Generate routing profiles
on:
  push:
    branches: [main]
    paths: ['source/**', 'scripts/**', '.github/workflows/generate.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profiles-${{ github.ref }}
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ./.github/actions/sing-box
      - run: python scripts/generate.py
      - name: Опубликовать проверенные подписки
        run: |
          git add awg shadowrocket throne singbox
          bash scripts/publish.sh "Обновить подписки маршрутизации"
