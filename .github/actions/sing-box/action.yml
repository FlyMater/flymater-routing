name: Установить sing-box
description: Закреплённый компилятор наборов
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        cd "$RUNNER_TEMP"
        archive=sing-box-1.12.0-linux-amd64
        curl --fail --location --retry 3 -o "$archive.tar.gz" "https://github.com/SagerNet/sing-box/releases/download/v1.12.0/$archive.tar.gz"
        tar xzf "$archive.tar.gz" "$archive/sing-box"
        echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
