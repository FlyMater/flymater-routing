name: Установить sing-box
description: Закреплённый компилятор наборов
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        cd "$RUNNER_TEMP"
        version=1.12.0
        archive="sing-box-$version-linux-amd64"
        if curl --fail --location --retry 3 -o "$archive.tar.gz" "https://github.com/SagerNet/sing-box/releases/download/v$version/$archive.tar.gz"; then
          tar xzf "$archive.tar.gz" "$archive/sing-box"
        else
          echo "::warning::Архив sing-box недоступен. Собираем v$version через Go module proxy."
          mkdir -p "$archive"
          GOBIN="$RUNNER_TEMP/$archive" GOPROXY=https://proxy.golang.org go install "github.com/sagernet/sing-box/cmd/sing-box@v$version"
        fi
        echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
