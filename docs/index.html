<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlyMater · Маршрутизация</title>
<link rel="stylesheet" href="panel.css">
<header><strong>FlyMater</strong><span>Маршрутизация</span><a id="repo">Репозиторий ↗</a></header>
<main><h1>Каталог маршрутизации</h1>
<p id="status" role="status">Загрузка настроек…</p>
<fieldset id="editor" disabled>
<div class="catalog-columns">
<section><h2>Доступные наборы</h2><div class="row"><select aria-label="Каталог" id="catalog"></select><button id="refresh">Обновить каталог</button></div>
<details><summary>Добавить каталог</summary><form id="addCatalog"><label>Название<input id="catalogName" required></label><label>Папка GitHub или JSON-индекс<input id="catalogUrl" type="url" required></label><button>Добавить</button></form></details>
<label>Поиск по названию, описанию или тегу<input type="search" id="query" placeholder="Например, Телеграм"></label>
<p id="catalogState" role="status"></p><div id="matches"></div>
<details><summary>Добавить набор по ссылке</summary><form id="addSet"><label>Тег<input id="tag" required></label><label>URL набора<input type="url" id="setUrl" required></label><button>Добавить</button></form></details></section>
<section><h2>Выбрано</h2><select id="routeView" aria-label="Версия маршрутов" hidden></select><div id="selected"></div></section>
</div>
<section><h2>Проверка и публикация</h2><label>GitHub-токен для этого репозитория<input id="token" type="password" autocomplete="off" spellcheck="false"></label>
<div class="row"><button id="check">Проверить черновик</button><button id="publish" disabled>Опубликовать</button></div>
<p id="report" role="status"></p></section></fieldset>
<section><h2>Сборка подписок</h2><p id="build" role="status"></p></section>
</main><script type="module" src="panel.js"></script></html>
